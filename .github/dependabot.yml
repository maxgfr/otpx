version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stays on the major age uses (age 0.12 -> x25519-dalek 2), so one copy is built.
      - dependency-name: x25519-dalek
        update-types: [version-update:semver-major]
    groups:
      # The RustCrypto crates share the digest traits and must move together, majors included.
      rustcrypto:
        patterns:
          - sha1
          - sha2
          - hmac
          - hkdf
          - argon2
          - scrypt
          - pbkdf2
          - aes-gcm
          - chacha20poly1305
          - digest
          - cipher
          - aead
        update-types: [major, minor, patch]
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # 10.x only renders with conventional-changelog-writer 9, and
      # @semantic-release/release-notes-generator 14.1.1 still ships writer 8.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
