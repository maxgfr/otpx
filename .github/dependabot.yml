version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # The RustCrypto crates share the digest traits and must move together, majors included.
      rustcrypto:
        patterns:
          - sha1
          - sha2
          - hmac
          - hkdf
          - argon2
          - scrypt
          - pbkdf2
          - aes-gcm
          - chacha20poly1305
          - digest
          - cipher
          - aead
        update-types: [major, minor, patch]
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
